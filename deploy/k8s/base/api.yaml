apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: api
          image: lab-api:000
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: postgres://app:app@db:5432/app
            - name: PORT
              value: "3000"
            - name: PG_POOL_MAX
              value: "10"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: {path: /health, port: 3000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 3000}
            periodSeconds: 5
          resources:
            requests: {cpu: 500m, memory: 128Mi}
            limits: {cpu: 500m, memory: 128Mi}
---
# NodePort 31000 is mapped to the host by lab/kind.yaml.
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 31000
