name: ci

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    container: node:24
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: npm run lint:node
      - run: npm run test
      - name: install api-node deps
        run: npm ci --no-audit --no-fund --prefix services/api-node
      - name: start api-node
        run: |
          node services/api-node/src/server.ts &
          echo $! > /tmp/api-node.pid
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 0.5; done
      # Filter widens each challenge as endpoints land, and is deleted at C12.
      - name: contract
        run: npm run contract -- http://127.0.0.1:8080 '/healthz|/readyz|/metrics'
      - name: stop api-node
        if: always()
        run: kill -TERM "$(cat /tmp/api-node.pid)" || true

  dotnet:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@v4
      - run: dotnet build tools/complexity-fixture --nologo
