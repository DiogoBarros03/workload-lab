<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Load generator</title>
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #fff; --muted: #666; --line: #ddd; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6e6e6; --bg: #151515; --muted: #999; --line: #333; } }
  body { font: 15px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0 auto; padding: 16px; max-width: 960px; }
  form { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  label { display: flex; flex-direction: column; font-size: 13px; color: var(--muted); }
  input, select, button { font: inherit; padding: 6px 8px; }
  input { width: 8em; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  th, td { border-bottom: 1px solid var(--line); padding: 4px 10px; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  #progress { color: var(--muted); min-height: 1.5em; }
</style>
</head>
<body>
<h1>Load generator</h1>
<form id="form">
  <label>Operation
    <select name="op"><option>read</option><option>write</option><option>mixed</option></select>
  </label>
  <label>Requests <input name="requests" type="number" min="1" max="200000" value="2000" required></label>
  <label>Concurrency <input name="concurrency" type="number" min="1" max="5000" value="50" required></label>
  <button id="run" type="submit">Run</button>
  <button id="reset" type="button">Reset data</button>
</form>
<p id="progress" role="status" aria-live="polite"></p>

<h2>Current run</h2>
<div class="scroll"><table><tbody id="current"><tr><td>No run yet.</td></tr></tbody></table></div>

<h2>History</h2>
<div class="scroll"><table>
  <thead><tr><th>#</th><th>op</th><th>requests</th><th>conc.</th><th>req/s</th><th>p50</th><th>p95</th><th>p99</th><th>max</th><th>mean</th><th>errors</th><th>statuses</th></tr></thead>
  <tbody id="history"></tbody>
</table></div>

<script>
const $ = (id) => document.getElementById(id);
const ms = (v) => v.toFixed(1);
const statuses = (s) => Object.entries(s.statusCounts).map(([k, v]) => `${k}: ${v}`).join(", ");
let runs = 0;

function row(cells, tag = "td") {
  const tr = document.createElement("tr");
  tr.append(...cells.map((c) => Object.assign(document.createElement(tag), { textContent: c })));
  return tr;
}

function showResult(cfg, s) {
  const l = s.latency;
  const lines = [
    ["requests", s.requests], ["duration ms", ms(s.durationMs)], ["req/s", ms(s.rps)],
    ["p50 ms", ms(l.p50)], ["p95 ms", ms(l.p95)], ["p99 ms", ms(l.p99)],
    ["max ms", ms(l.max)], ["mean ms", ms(l.mean)],
    ["network errors", s.errors], ["statuses", statuses(s)],
  ];
  $("current").replaceChildren(...lines.map(([k, v]) => row([k, String(v)])));
  runs += 1;
  $("history").append(row([runs, cfg.op, s.requests, cfg.concurrency, ms(s.rps),
    ms(l.p50), ms(l.p95), ms(l.p99), ms(l.max), ms(l.mean), s.errors, statuses(s)].map(String)));
}

// Returns true when the block ends the run (result or error).
function handle(cfg, block) {
  const event = /^event: (.*)$/m.exec(block)?.[1];
  const line = /^data: (.*)$/m.exec(block);
  if (!line) return false;
  const data = JSON.parse(line[1]);
  if (event === "progress") $("progress").textContent =
    `${data.done} / ${cfg.requests} done, ${data.inFlight} in flight, ${(data.elapsedMs / 1000).toFixed(1)} s`;
  if (event === "result") { $("progress").textContent = "Done."; showResult(cfg, data); }
  if (event === "error") $("progress").textContent = `Failed: ${data.error}`;
  return event === "result" || event === "error";
}

async function stream(cfg) {
  const res = await fetch("/run", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(cfg) });
  if (!res.ok) { const body = await res.json(); throw new Error(body.message ?? body.error); }
  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
  let buf = "";
  let ended = false;
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    const parts = (buf + value).split("\n\n");
    buf = parts.pop();
    ended = parts.map((p) => handle(cfg, p)).some(Boolean) || ended;
  }
  if (!ended) throw new Error("run ended without a result");
}

async function busy(fn) {
  const buttons = [$("run"), $("reset")];
  buttons.forEach((b) => { b.disabled = true; });
  try { await fn(); } catch (e) { $("progress").textContent = `Failed: ${e.message}`; }
  buttons.forEach((b) => { b.disabled = false; });
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const cfg = { op: f.get("op"), requests: Number(f.get("requests")), concurrency: Number(f.get("concurrency")) };
  $("progress").textContent = "Seeding...";
  busy(() => stream(cfg));
});

$("reset").addEventListener("click", () => busy(async () => {
  const res = await fetch("/reset", { method: "POST" });
  const body = await res.json();
  if (!res.ok) throw new Error(body.error);
  $("progress").textContent = `Reset: deleted ${body.deleted} authors and their books.`;
}));
</script>
</body>
</html>
